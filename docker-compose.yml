services:
  mysql:
    image: mysql:8.4
    container_name: fitness_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: fitness_app
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fitness_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: fitness_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - fitness_net
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: fitness_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=fitness_app
    networks:
      - fitness_net

  frontend:
    build: ./frontend
    container_name: fitness_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3001
    networks:
      - fitness_net

volumes:
  mysql_data:

networks:
  fitness_net:
    driver: bridge
